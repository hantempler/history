name: History Shorts Pipeline
on:
  # 수동 실행을 위한 워크플로우 디스패치 (파이프라인 선택 및 날짜 지정 가능)
  workflow_dispatch:
    inputs:
      pipeline:
        description: '실행할 파이프라인 선택'
        required: true
        default: 'all (둘 다 순차 실행)'
        type: choice
        options:
          - 'all (둘 다 순차 실행)'
          - 'daily (1분 타임머신만 실행)'
          - 'deepdive (마스터피스 심층만 실행)'
      target_date:
        description: '실행 대상 날짜 (비워두면 오늘 날짜. 예: 2026-10-21)'
        required: false
        default: ''
        type: string

  # Cloudflare Workers 등 외부 API 호출을 위한 디스패치
  repository_dispatch:
    types: [trigger-history-shorts]

  # GitHub 내부 타이머(schedule)는 Cloudflare Cron과 중복되므로 삭제함.
# 동일 그룹의 job이 이미 실행 중이면 이전 것을 취소하고 새 것을 실행
concurrency:
  group: briefing-pipeline
  cancel-in-progress: true

# 봇이 Git Commit & Push를 할 수 있도록 쓰기 권한 부여
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 두 파이프라인 순차 실행을 고려하여 타임아웃 상향

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f history_daily/requirements.txt ]; then pip install -r history_daily/requirements.txt; fi
          if [ -f history_deepdive/requirements.txt ]; then pip install -r history_deepdive/requirements.txt; fi

      - name: Setup Google Cloud Credentials
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          mkdir -p history_daily/config
          mkdir -p history_deepdive/config
          echo "$GCP_CREDENTIALS" > history_daily/config/application_default_credentials.json
          echo "$GCP_CREDENTIALS" > history_deepdive/config/application_default_credentials.json

      - name: Setup YouTube Token
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p history_daily/config
          mkdir -p history_deepdive/config
          echo "$YOUTUBE_TOKEN" > history_daily/config/youtube_token.json
          echo "$YOUTUBE_TOKEN" > history_deepdive/config/youtube_token.json

      # -----------------------------------------------------------------------
      # [1단계] history_daily 파이프라인 실행 (역사 속 오늘 / 1분 타임머신)
      # (선택값이 'all' 이거나 'daily' 일 때만 가동)
      # -----------------------------------------------------------------------
      - name: Run Pipeline (History Daily Shorts) with retry
        if: ${{ github.event_name != 'workflow_dispatch' || contains(inputs.pipeline, 'all') || contains(inputs.pipeline, 'daily') }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 50
          command: |
            echo "Executing headless pipeline for history daily shorts"
            TARGET_DATE="${{ inputs.target_date }}"
            if [ -n "$TARGET_DATE" ]; then
              CLEAN_DATE=$(echo "$TARGET_DATE" | tr -d '-')
              echo "Using target date: $CLEAN_DATE"
              python history_daily/auto_run.py --date "$CLEAN_DATE"
            else
              python history_daily/auto_run.py
            fi

      # -----------------------------------------------------------------------
      # [2단계] history_deepdive 마스터피스 순차 실행 & 유튜브 업로드
      # (선택값이 'all' 이거나 'deepdive' 일 때만 가동)
      # -----------------------------------------------------------------------
      - name: Run Pipeline (History Deepdive Masterpiece & Auto Upload) with retry
        if: ${{ github.event_name != 'workflow_dispatch' || contains(inputs.pipeline, 'all') || contains(inputs.pipeline, 'deepdive') }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 50
          command: |
            echo "Executing History Deepdive Masterpiece Pipeline with Auto Upload"
            TARGET_DATE="${{ inputs.target_date }}"
            if [ -n "$TARGET_DATE" ]; then
              echo "Using target date: $TARGET_DATE"
              python history_deepdive/auto_run_masterpiece.py --upload --date "$TARGET_DATE"
            else
              python history_deepdive/auto_run_masterpiece.py --upload
            fi
