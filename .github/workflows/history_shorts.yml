name: History Shorts Pipeline
on:
  # 수동 실행을 위한 워크플로우 디스패치
  workflow_dispatch:

  # Cloudflare Workers 등 외부 API 호출을 위한 디스패치
  repository_dispatch:
    types: [trigger-history-shorts]

  # GitHub 내부 타이머(schedule)는 Cloudflare Cron과 중복되므로 삭제함.
# 동일 그룹의 job이 이미 실행 중이면 이전 것을 취소하고 새 것을 실행
concurrency:
  group: briefing-pipeline
  cancel-in-progress: true

# 봇이 Git Commit & Push를 할 수 있도록 쓰기 권한 부여
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 두 파이프라인 순차 실행을 고려하여 타임아웃 상향

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f history_deepdive/requirements.txt ]; then pip install -r history_deepdive/requirements.txt; fi

      - name: Setup Google Cloud Credentials
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          mkdir -p config
          mkdir -p history_deepdive/config
          echo "$GCP_CREDENTIALS" > config/application_default_credentials.json
          echo "$GCP_CREDENTIALS" > history_deepdive/config/application_default_credentials.json

      - name: Setup YouTube Token
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p config
          mkdir -p history_deepdive/config
          echo "$YOUTUBE_TOKEN" > config/youtube_token.json
          echo "$YOUTUBE_TOKEN" > history_deepdive/config/youtube_token.json

      # -----------------------------------------------------------------------
      # [1단계] 기존 파이프라인 우선 실행 (기존 동작 100% 보장)
      # -----------------------------------------------------------------------
      - name: Run Pipeline (Existing history shorts) with retry
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 50
          command: |
            echo "Executing headless pipeline for history shorts"
            python src/auto_run.py

      # -----------------------------------------------------------------------
      # [2단계] 기존 파이프라인 완료 후 -> history_deepdive 마스터피스 순차 실행 & 유튜브 업로드
      # -----------------------------------------------------------------------
      - name: Run Pipeline (History Deepdive Masterpiece & Auto Upload) with retry
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 50
          command: |
            echo "Executing History Deepdive Masterpiece Pipeline with Auto Upload"
            python history_deepdive/auto_run_masterpiece.py --upload
